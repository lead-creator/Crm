<style>
  :root{
    --bg:#F2EFE7;
    --surface:#FFFFFF;
    --surface-2:#EAF1F4;
    --surface-3:#DCEAEE;
    --border:#D7E2DE;
    --border-soft:#E7EEE9;
    --ink:#16283C;
    --muted:#5D7690;
    --muted-2:#8FA3B3;
    --accent:#3368A0;
    --accent-ink:#FFFFFF;
    --accent-soft:rgba(51,104,160,.10);
    --hot:#3368A0;
    --hot-soft:rgba(51,104,160,.12);
    --warm:#3E85A6;
    --warm-soft:rgba(102,163,191,.20);
    --cold:#5E8B90;
    --cold-soft:rgba(200,223,219,.55);
    --won:#1F4A72;
    --won-soft:rgba(31,74,114,.12);
    --lost:#9C948A;
    --lost-soft:rgba(156,148,138,.18);
    --radius:10px;
    --font-display:'Space Grotesk','Segoe UI',system-ui,sans-serif;
    --font-body:'Inter','Segoe UI',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(51,104,160,.07), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  ::selection{background:var(--accent);color:var(--accent-ink);}
  a{color:inherit;}

  /* ---------- layout ---------- */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:216px;
    flex:0 0 216px;
    background:var(--surface);
    border-right:1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    padding:22px 16px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 4px 22px;border-bottom:1px solid var(--border-soft);margin-bottom:18px;}
  .brand-mark{
    width:38px;height:38px;border-radius:9px;
    background:var(--surface-2);border:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;padding:4px;
  }
  .brand-mark img{width:100%;height:100%;object-fit:contain;}
  .brand-text{line-height:1.15;}
  .brand-text b{font-family:var(--font-display);font-size:15px;letter-spacing:.02em;display:block;}
  .brand-text b .dig{color:var(--hot);}
  .brand-text span{font-size:11px;color:var(--muted);letter-spacing:.03em;}

  nav{display:flex;flex-direction:column;gap:3px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:8px;
    color:var(--muted);font-size:13.5px;font-weight:500;
    cursor:pointer;border:1px solid transparent;
    transition:background .12s, color .12s;
  }
  .nav-item svg{width:16px;height:16px;flex:0 0 auto;opacity:.85;}
  .nav-item:hover{background:var(--surface-2);color:var(--ink);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);}
  .nav-item.active svg{opacity:1;}

  .sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--border-soft);}
  .who{display:flex;align-items:center;gap:9px;padding:6px 4px;}
  .who .dot{width:8px;height:8px;border-radius:50%;background:var(--won);box-shadow:0 0 0 3px var(--won-soft);flex:0 0 auto;}
  .who b{display:block;font-size:12.5px;font-weight:600;}
  .who span{font-size:11px;color:var(--muted);}
  .notif-btn{
    width:100%;margin-top:10px;padding:8px 10px;border-radius:8px;
    background:var(--surface-2);border:1px solid var(--border);
    color:var(--muted);font-size:11.5px;text-align:left;cursor:pointer;
  }
  .notif-btn.on{color:var(--accent);border-color:rgba(51,104,160,.35);}

  main{flex:1;min-width:0;padding:26px 32px 60px;max-width:1180px;}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
  .topbar h1{font-family:var(--font-display);font-size:22px;margin:0;letter-spacing:-.01em;}
  .topbar p{margin:4px 0 0;color:var(--muted);font-size:13px;}
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--accent);color:var(--accent-ink);
    border:none;border-radius:8px;padding:9px 15px;
    font-weight:600;font-size:13px;cursor:pointer;
    transition:transform .08s, filter .12s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--border);}
  .btn.ghost:hover{background:var(--surface-2);}
  .btn.danger{background:transparent;color:var(--lost);border:1px solid rgba(156,148,138,.45);}
  .btn.danger:hover{background:var(--lost-soft);}
  .btn.small{padding:6px 11px;font-size:12px;}

  /* ---------- dashboard ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .stat-card{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat-card .label{font-size:11.5px;color:var(--muted);letter-spacing:.02em;}
  .stat-card .num{font-family:var(--font-display);font-size:30px;margin-top:6px;line-height:1;}
  .stat-card .sub{font-size:11.5px;color:var(--muted-2);margin-top:6px;}
  .stat-card.accent .num{color:var(--accent);}
  .stat-card.hot .num{color:var(--hot);}
  .stat-card.won .num{color:var(--won);}

  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start;}
  @media (max-width:900px){.grid-2{grid-template-columns:1fr;} .stat-row{grid-template-columns:repeat(2,1fr);}}

  .panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
  .panel h2{font-family:var(--font-display);font-size:14.5px;margin:0 0 3px;}
  .panel .hint{font-size:11.5px;color:var(--muted);margin:0 0 14px;}

  /* funnel */
  .funnel-row{display:flex;align-items:center;gap:12px;padding:7px 0;}
  .funnel-row .fname{width:118px;flex:0 0 auto;font-size:12.5px;color:var(--muted);}
  .funnel-bar-track{flex:1;height:9px;background:var(--surface-3);border-radius:5px;overflow:hidden;}
  .funnel-bar{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),#1F4A72);}
  .funnel-row .fcount{width:26px;text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--ink);}

  /* departure board */
  .board{border-top:1px solid var(--border-soft);}
  .board-row{
    display:grid;grid-template-columns:64px 1fr 100px 84px;gap:10px;
    align-items:center;padding:10px 2px;border-bottom:1px solid var(--border-soft);
    font-family:var(--font-mono);font-size:12.5px;
  }
  .board-row.head{color:var(--muted-2);font-size:10.5px;letter-spacing:.06em;font-family:var(--font-body);text-transform:uppercase;padding-bottom:8px;}
  .board-row .btime{color:var(--accent);font-weight:600;}
  .board-row .bname{font-family:var(--font-body);color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .board-row .bstatus{font-size:10.5px;padding:3px 7px;border-radius:100px;text-align:center;font-family:var(--font-body);font-weight:600;letter-spacing:.02em;}
  .board-empty{padding:24px 4px;color:var(--muted);font-size:12.5px;text-align:center;}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:100px;letter-spacing:.02em;white-space:nowrap;}
  .pill .d{width:6px;height:6px;border-radius:50%;}
  .pill.hot{background:var(--hot-soft);color:var(--hot);}
  .pill.hot .d{background:var(--hot);}
  .pill.warm{background:var(--warm-soft);color:var(--warm);}
  .pill.warm .d{background:var(--warm);}
  .pill.cold{background:var(--cold-soft);color:var(--cold);}
  .pill.cold .d{background:var(--cold);}

  .stagepill{background:var(--surface-3);color:var(--ink);}
  .stagepill.won{background:var(--won-soft);color:var(--won);}
  .stagepill.lost{background:var(--lost-soft);color:var(--lost);}
  .stagepill.due{background:var(--hot-soft);color:var(--hot);}

  /* ---------- leads table ---------- */
  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .search{
    flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;padding:9px 12px;color:var(--ink);font-size:13px;
  }
  .search:focus{outline:none;border-color:var(--accent);}
  select.filter{
    background:var(--surface);border:1px solid var(--border);color:var(--ink);
    border-radius:8px;padding:9px 10px;font-size:12.5px;
  }
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;}
  thead th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted-2);padding:11px 14px;border-bottom:1px solid var(--border-soft);font-weight:600;
  }
  tbody td{padding:12px 14px;border-bottom:1px solid var(--border-soft);font-size:13px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{cursor:pointer;transition:background .1s;}
  tbody tr:hover{background:var(--surface-2);}
  .cell-name b{display:block;font-weight:600;}
  .cell-name span{font-size:11.5px;color:var(--muted);}
  .cell-meeting{font-family:var(--font-mono);font-size:12px;color:var(--muted);}
  .cell-meeting.soon{color:var(--hot);}
  .empty-state{padding:50px 20px;text-align:center;color:var(--muted);}
  .empty-state .big{font-size:30px;margin-bottom:8px;}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(4,7,8,.6);backdrop-filter:blur(2px);
    display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;
    z-index:50;overflow:auto;
  }
  .modal{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    width:100%;max-width:560px;padding:24px 26px 26px;
  }
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:10px;}
  .modal-head h2{font-family:var(--font-display);font-size:18px;margin:0;}
  .close-x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:2px;}
  .close-x:hover{color:var(--ink);}

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.01em;}
  .field input,.field select,.field textarea{
    background:var(--surface-2);border:1px solid var(--border);color:var(--ink);
    border-radius:7px;padding:9px 10px;font-size:13px;font-family:inherit;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:60px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  /* lead detail */
  .detail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .detail-name{font-family:var(--font-display);font-size:19px;}
  .detail-company{color:var(--muted);font-size:13px;margin-top:2px;}
  .detail-meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:18px 0;padding:14px 0;border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);}
  .kv .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);margin-bottom:3px;}
  .kv .v{font-size:13.5px;}
  .kv .v a{color:var(--accent);text-decoration:none;}
  .timeline{margin-top:6px;}
  .timeline h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-2);margin:0 0 10px;}
  .tl-item{display:flex;gap:10px;padding-bottom:14px;position:relative;}
  .tl-item:before{content:"";position:absolute;left:3px;top:14px;bottom:-2px;width:1px;background:var(--border);}
  .tl-item:last-child:before{display:none;}
  .tl-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:5px;flex:0 0 auto;}
  .tl-body p{margin:0;font-size:13px;line-height:1.5;}
  .tl-body time{font-size:11px;color:var(--muted-2);font-family:var(--font-mono);}
  .add-note{display:flex;gap:8px;margin-top:14px;}
  .add-note input{flex:1;}
  .detail-actions{display:flex;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-soft);}

  /* ---------- reminders ---------- */
  .rem-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .rem-group-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2);margin:20px 0 8px;font-weight:600;}
  .rem-group-title:first-child{margin-top:0;}
  .rem-list{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;}
  .rem-row{
    display:flex;align-items:center;gap:12px;padding:12px 16px;
    border-bottom:1px solid var(--border-soft);cursor:pointer;transition:background .1s;
  }
  .rem-row:last-child{border-bottom:none;}
  .rem-row:hover{background:var(--surface-2);}
  .rem-row.done{opacity:.5;}
  .rem-row.done .rem-title{text-decoration:line-through;}
  .rem-check{
    width:19px;height:19px;border-radius:6px;border:1.5px solid var(--border);
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);cursor:pointer;color:var(--accent);font-size:12px;
  }
  .rem-row.done .rem-check{background:var(--accent-soft);border-color:var(--accent);}
  .rem-main{flex:1;min-width:0;}
  .rem-title{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rem-note{font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rem-when{font-family:var(--font-mono);font-size:12px;color:var(--muted);flex:0 0 auto;text-align:right;min-width:78px;}
  .rem-when.due{color:var(--hot);}
  .rem-del{background:none;border:none;color:var(--muted-2);font-size:16px;cursor:pointer;padding:2px 4px;flex:0 0 auto;}
  .rem-del:hover{color:var(--hot);}
  .label-tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:100px;letter-spacing:.02em;white-space:nowrap;flex:0 0 auto;}
  .mini-board .label-tag{margin-right:8px;}
  .mini-rem-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
  .mini-rem-row:last-child{border-bottom:none;}
  .mini-rem-row .rt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mini-rem-row .rw{font-family:var(--font-mono);color:var(--muted);font-size:11.5px;flex:0 0 auto;}

  .toast-wrap{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:var(--surface-2);border:1px solid var(--accent);border-radius:9px;
    padding:12px 16px;font-size:13px;max-width:300px;box-shadow:0 12px 30px rgba(21,36,53,.16);
    animation:in .2s ease;
  }
  .toast b{display:block;color:var(--accent);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
  .toast-action{margin-top:8px;}
  .toast-btn{
    background:var(--accent-soft);color:var(--accent);border:1px solid rgba(51,104,160,.4);
    border-radius:6px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .toast-btn:hover{background:var(--accent);color:var(--accent-ink);}
  @keyframes in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  @media (max-width:720px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s;}
    .sidebar.open{transform:translateX(0);}
    main{padding:18px;}
    .field-row{grid-template-columns:1fr;}
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .board-row{grid-template-columns:52px 1fr 78px;}
    .board-row .bstatus{display:none;}
  }
</style>

<script>
/* ===================== data layer ===================== */
const STORE_KEY = 'skypath_crm_leads_v1';
const STAGES = ['New','Contacted','Meeting Scheduled','Proposal Sent','Negotiation','Won','Lost'];
const OPEN_STAGES = ['New','Contacted','Meeting Scheduled','Proposal Sent','Negotiation'];

function loadLeads(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ console.error('load failed', e); return []; }
}
function saveLeads(leads){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(leads)); }
  catch(e){ console.error('save failed', e); toast('Storage error', 'Could not save — your browser storage may be full or blocked.'); }
}
let leads = loadLeads();
let currentView = 'dashboard';
let filters = { q:'', stage:'', quality:'' };
let notifiedMeetings = new Set(JSON.parse(localStorage.getItem('skypath_notified_v1')||'[]'));

/* ---- reminders data ---- */
const REM_KEY = 'skypath_reminders_v1';
const REMINDER_LABELS = ['Meeting','Shoot','Call','Follow-up','Deadline','Personal'];
function loadReminders(){
  try{ const raw = localStorage.getItem(REM_KEY); return raw ? JSON.parse(raw) : []; }
  catch(e){ console.error('load reminders failed', e); return []; }
}
function saveReminders(rems){
  try{ localStorage.setItem(REM_KEY, JSON.stringify(rems)); }
  catch(e){ console.error('save reminders failed', e); toast('Storage error','Could not save the reminder.'); }
}
let reminders = loadReminders();
let remFilterLabel = '';
let notifiedReminders = new Set(JSON.parse(localStorage.getItem('skypath_notified_rem_v1')||'[]'));

const LABEL_PALETTE = [
  {bg:'rgba(51,104,160,.14)', fg:'#3368A0'},
  {bg:'rgba(31,74,114,.14)', fg:'#1F4A72'},
  {bg:'rgba(102,163,191,.22)', fg:'#3E7A93'},
  {bg:'rgba(200,223,219,.60)', fg:'#4C7B76'},
  {bg:'rgba(156,148,138,.22)', fg:'#7A7266'},
  {bg:'rgba(95,140,163,.20)', fg:'#3F6A80'},
];
function labelColor(label){
  let hash = 0;
  const s = (label||'other');
  for(let i=0;i<s.length;i++) hash = (hash*31 + s.charCodeAt(i)) >>> 0;
  return LABEL_PALETTE[hash % LABEL_PALETTE.length];
}
function labelTag(label){
  const c = labelColor(label);
  return `<span class="label-tag" style="background:${c.bg};color:${c.fg};">${escapeHtml(label||'Other')}</span>`;
}

function uid(){ return 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nowISO(){ return new Date().toISOString(); }

/* ===================== helpers ===================== */
function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleString(undefined,{ month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function fmtDay(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function timeUntilLabel(iso){
  const diffMs = new Date(iso) - new Date();
  const mins = Math.round(diffMs/60000);
  if(mins < -1) return `${Math.abs(mins)}m ago`;
  if(mins <= 1) return 'now';
  if(mins < 60) return `in ${mins}m`;
  const hrs = Math.round(mins/60);
  if(hrs < 24) return `in ${hrs}h`;
  return `in ${Math.round(hrs/24)}d`;
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function stageClass(stage){
  if(stage==='Won') return 'won';
  if(stage==='Lost') return 'lost';
  return '';
}
function qualityKey(q){ return (q||'warm').toLowerCase(); }

function toast(title, body, action){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<b>${escapeHtml(title)}</b>${escapeHtml(body)}` +
    (action ? `<div class="toast-action"><button class="toast-btn">${escapeHtml(action.label)}</button></div>` : '');
  wrap.appendChild(el);
  const life = action ? 6000 : 7000;
  const timer = setTimeout(() => el.remove(), life);
  if(action){
    el.querySelector('.toast-btn').addEventListener('click', () => {
      clearTimeout(timer);
      action.onClick();
      el.remove();
    });
  }
}

/* ===================== notifications ===================== */
function updateNotifBtn(){
  const btn = document.getElementById('notifBtn');
  if(!('Notification' in window)){ btn.textContent = '🔕 Alerts unsupported'; btn.disabled = true; return; }
  if(Notification.permission === 'granted'){ btn.textContent = '🔔 Meeting alerts on'; btn.classList.add('on'); }
  else{ btn.textContent = '🔔 Enable meeting alerts'; btn.classList.remove('on'); }
}
document.getElementById('notifBtn').addEventListener('click', () => {
  if(!('Notification' in window)) return;
  Notification.requestPermission().then(updateNotifBtn);
});

function checkMeetingAlerts(){
  const now = Date.now();
  leads.forEach(l => {
    if(!l.meetingAt) return;
    const t = new Date(l.meetingAt).getTime();
    if(isNaN(t)) return;
    const diff = t - now;
    // fire once when meeting is within the next 60s (or just passed, up to 60s late in case tab was inactive)
    if(diff <= 60000 && diff > -60000 && !notifiedMeetings.has(l.id)){
      notifiedMeetings.add(l.id);
      localStorage.setItem('skypath_notified_v1', JSON.stringify([...notifiedMeetings]));
      const msg = `${l.name}${l.company ? ' · ' + l.company : ''} — now`;
      toast('Meeting starting', msg);
      if('Notification' in window && Notification.permission === 'granted'){
        try{ new Notification('Skypath CRM — meeting now', { body: msg }); }catch(e){}
      }
    }
  });
  reminders.forEach(r => {
    if(!r.at || r.done) return;
    const t = new Date(r.at).getTime();
    if(isNaN(t)) return;
    const diff = t - now;
    if(diff <= 60000 && diff > -60000 && !notifiedReminders.has(r.id)){
      notifiedReminders.add(r.id);
      localStorage.setItem('skypath_notified_rem_v1', JSON.stringify([...notifiedReminders]));
      const msg = `${r.title} · ${r.label||'Reminder'}`;
      toast('Reminder', msg);
      if('Notification' in window && Notification.permission === 'granted'){
        try{ new Notification('Skypath CRM — reminder', { body: msg }); }catch(e){}
      }
    }
  });
}

/* ===================== dashboard ===================== */

  const closed = won+lost;

  const upcoming = leads
    .filter(l => l.meetingAt && new Date(l.meetingAt) - new Date() > -3600000 && !['Won','Lost'].includes(l.stage))
    .sort((a,b)=> new Date(a.meetingAt)-new Date(b.meetingAt))

      <div class="stat-card"><div class="label">Total leads</div><div class="num">${total}</div><div class="sub">${OPEN_STAGES.map(s=>leads.filter(l=>l.stage===s).length).reduce((a,b)=>a+b,0)} active in pipeline</div></div>
      <div class="stat-card hot"><div class="label">Hot leads</div><div class="num">${hot}</div><div class="sub">Prioritize these first</div></div>
      <div class="stat-card accent"><div class="label">Upcoming meetings</div><div class="num">${upcoming.length}</div><div class="sub">Scheduled &amp; not yet closed</div></div>
      <div class="stat-card won"><div class="label">Win rate</div><div class="num">${winRate}%</div><div class="sub">${won} won · ${lost} lost</div></div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <h2>Pipeline funnel</h2>
        <p class="hint">Leads by stage</p>
        ${STAGES.map(s => {
          const c = leads.filter(l=>l.stage===s).length;
          return `<div class="funnel-row">
            <div class="fname">${s}</div>
            <div class="funnel-bar-track"><div class="funnel-bar" style="width:${c/funnelMax*100}%; ${s==='Won'?'background:linear-gradient(90deg,#1F4A72,#123252);':''} ${s==='Lost'?'background:linear-gradient(90deg,#9C948A,#756D63);':''}"></div></div>

        ${['hot','warm','cold'].map(q => {
          const c = leads.filter(l=>qualityKey(l.quality)===q).length;
          const pct = total ? Math.round(c/total*100) : 0;
          return `<div class="funnel-row">
            <div class="fname" style="text-transform:capitalize;">${q}</div>
            <div class="funnel-bar-track"><div class="funnel-bar" style="width:${pct}%; background:${q==='hot'?'linear-gradient(90deg,#3368A0,#1F4A72)':q==='warm'?'linear-gradient(90deg,#66A3BF,#3E7A93)':'linear-gradient(90deg,#C8DFDB,#7FA69E)'};"></div></div>
            <div class="fcount">${c}</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="panel">
      <h2>Departures — upcoming meetings</h2>
      <p class="hint">Keep this tab open to get a browser alert when a meeting starts</p>
      <div class="board">
        <div class="board-row head"><div>Time</div><div>Lead</div><div>In</div><div>Stage</div></div>
        ${upcoming.length ? upcoming.map(l => `
          <div class="board-row" data-id="${l.id}" style="cursor:pointer;">
            <div class="btime">${fmtTime(l.meetingAt)}</div>
            <div class="bname">${escapeHtml(l.name)}${l.company?' · '+escapeHtml(l.company):''}</div>
            <div>${timeUntilLabel(l.meetingAt)}</div>

function renderDashReminders(){

/* ===================== reminders view ===================== */
function renderReminders(){
  const el = document.getElementById('viewReminders');
  const labelsInUse = [...new Set(reminders.map(r=>r.label).filter(Boolean))];
  const allLabels = [...new Set([...REMINDER_LABELS, ...labelsInUse])];
  el.innerHTML = `
    <div class="rem-toolbar">
      <select class="filter" id="remLabelFilter">
        <option value="">All labels</option>
        ${allLabels.map(l=>`<option value="${escapeHtml(l)}" ${remFilterLabel===l?'selected':''}>${escapeHtml(l)}</option>`).join('')}
      </select>
    </div>
    <div id="remListWrap"></div>
  `;
  document.getElementById('remLabelFilter').addEventListener('change', e => { remFilterLabel = e.target.value; renderRemindersList(); });
  renderRemindersList();
}

function renderRemindersList(){
  const wrap = document.getElementById('remListWrap');
  if(!wrap) return;
  let list = reminders.slice();
  if(remFilterLabel) list = list.filter(r => r.label === remFilterLabel);

  if(!reminders.length){
    wrap.innerHTML = `<div class="empty-state"><div class="big">⏰</div>No reminders yet.<br><br><button class="btn" onclick="openReminderForm()">+ Add your first reminder</button></div>`;
    return;
  }
  if(!list.length){
    wrap.innerHTML = `<div class="empty-state">No reminders with this label.</div>`;
    return;
  }

  const open = list.filter(r=>!r.done).sort((a,b)=>{
    if(!a.at && !b.at) return 0;
    if(!a.at) return 1;
    if(!b.at) return -1;
    return new Date(a.at)-new Date(b.at);
  });
  const done = list.filter(r=>r.done).sort((a,b)=> new Date(b.at||0)-new Date(a.at||0));

  function row(r){
    const overdue = r.at && !r.done && (new Date(r.at) - new Date() < 0);
    return `
      <div class="rem-row ${r.done?'done':''}" data-id="${r.id}">
        <div class="rem-check" data-toggle="${r.id}">${r.done?'✓':''}</div>
        <div class="rem-main">
          <div class="rem-title">${labelTag(r.label)} ${escapeHtml(r.title)}</div>
          ${r.note ? `<div class="rem-note">${escapeHtml(r.note)}</div>` : ''}
        </div>
        <div class="rem-when ${overdue?'due':''}">${r.at ? fmtDateTime(r.at) : 'No time set'}</div>
        <button class="rem-del" data-del="${r.id}" title="Delete">×</button>
      </div>
    `;
  }

  wrap.innerHTML = `
    ${open.length ? `<div class="rem-group-title">Open · ${open.length}</div><div class="rem-list">${open.map(row).join('')}</div>` : ''}
    ${done.length ? `<div class="rem-group-title">Done · ${done.length}</div><div class="rem-list">${done.map(row).join('')}</div>` : ''}
  `;

  wrap.querySelectorAll('.rem-check').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    toggleReminderDone(el.dataset.toggle);
  }));
  wrap.querySelectorAll('.rem-del').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    deleteReminder(el.dataset.del);
  }));
  wrap.querySelectorAll('.rem-row').forEach(el => el.addEventListener('click', () => {
    openReminderForm(reminders.find(r=>r.id===el.dataset.id));
  }));
}

function toggleReminderDone(id){
  const r = reminders.find(x=>x.id===id);
  if(!r) return;
  r.done = !r.done;
  saveReminders(reminders);
  renderRemindersList();
  if(currentView==='dashboard') renderDashReminders();
}

function deleteReminder(id){
  const idx = reminders.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const removed = reminders[idx];
  reminders.splice(idx, 1);
  saveReminders(reminders);
  if(currentView==='reminders') renderRemindersList();
  if(currentView==='dashboard') renderDashboard();
  toast('Reminder deleted', removed.title, {
    label:'Undo',
    onClick: () => {
      reminders.splice(idx, 0, removed);
      saveReminders(reminders);
      if(currentView==='reminders') renderRemindersList();
      if(currentView==='dashboard') renderDashboard();
    }
  });
}

    if(isEdit){
      if(newAt !== r.at) notifiedReminders.delete(r.id);
      r.title = title; r.label = label; r.at = newAt; r.note = note;
      saveReminders(reminders);
      toast('Saved', 'Reminder updated.');
    } else {
      reminders.push({ id: uid(), title, label, at: newAt, note, done:false, createdAt: nowISO() });
      saveReminders(reminders);
      toast('Reminder added', title);

function toLocalInputValue(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function addNoteToLead(lead, text, save=true){
  lead.notes = lead.notes || [];
  lead.notes.unshift({ text, at: nowISO() });
  lead.updatedAt = nowISO();
  if(save) saveLeads(leads);
}

            </div>
          </div>
          <button class="close-x" id="closeX">×</button>
        </div>

        <div class="kv-grid">
          <div class="kv"><div class="k">Phone</div><div class="v"><a href="tel:${escapeHtml(l.phone||'')}">${escapeHtml(l.phone||'—')}</a></div></div>
          <div class="kv"><div class="k">Next meeting</div><div class="v">${l.meetingAt ? fmtDateTime(l.meetingAt) + ' · ' + timeUntilLabel(l.meetingAt) : '—'}</div></div>
          <div class="kv"><div class="k">Added</div><div class="v">${fmtDay(l.createdAt)}</div></div>
          <div class="kv"><div class="k">Last update</div><div class="v">${fmtDateTime(l.updatedAt||l.createdAt)}</div></div>
        </div>

        <div class="field-row" style="margin-bottom:6px;">
          <div class="field"><label>Move stage</label>
            <select id="quickStage">${STAGES.map(s=>`<option ${l.stage===s?'selected':''}>${s}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Update quality</label>
            <select id="quickQuality">
              <option ${l.quality==='Hot'?'selected':''}>Hot</option>
              <option ${(!l.quality||l.quality==='Warm')?'selected':''}>Warm</option>
              <option ${l.quality==='Cold'?'selected':''}>Cold</option>
            </select>
          </div>
        </div>

        <div class="timeline">
          <h3>Activity &amp; notes</h3>
          <div class="add-note">
            <input id="newNote" placeholder="Log an update — call notes, next step…">
            <button class="btn small" id="addNoteBtn">Add</button>
          </div>
          <div id="tlList" style="margin-top:14px;">
            ${(l.notes&&l.notes.length) ? l.notes.map(n=>`
              <div class="tl-item"><div class="tl-dot"></div><div class="tl-body"><time>${fmtDateTime(n.at)}</time><p>${escapeHtml(n.text)}</p></div></div>
            `).join('') : `<div style="color:var(--muted);font-size:12.5px;">No updates logged yet.</div>`}
          </div>
        </div>

        <div class="detail-actions">
          <button class="btn danger" id="deleteBtn">Delete lead</button>
          <button class="btn ghost" id="editBtn">Edit details</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('closeX').onclick = closeModal;
  document.getElementById('overlay').addEventListener('click', e => { if(e.target.id==='overlay') closeModal(); });
  document.getElementById('editBtn').onclick = () => openLeadForm(l);
  document.getElementById('deleteBtn').onclick = () => {
    const idx = leads.findIndex(x=>x.id===l.id);
    if(idx===-1) return;
    leads.splice(idx, 1);
    saveLeads(leads);
    closeModal();
    if(currentView==='dashboard') renderDashboard(); else renderLeads();
    toast('Lead deleted', l.name, {
      label:'Undo',
      onClick: () => {
        leads.splice(idx, 0, l);
        saveLeads(leads);
        if(currentView==='dashboard') renderDashboard(); else renderLeads();
      }
    });
  };
  document.getElementById('quickStage').addEventListener('change', e => {
    l.stage = e.target.value; l.updatedAt = nowISO(); saveLeads(leads);
    document.querySelector('.detail-meta .stagepill').textContent = l.stage;
    document.querySelector('.detail-meta .stagepill').className = `pill stagepill ${stageClass(l.stage)}`;
  });
  document.getElementById('quickQuality').addEventListener('change', e => {
    l.quality = e.target.value; l.updatedAt = nowISO(); saveLeads(leads);
    const p = document.querySelector('.detail-meta .pill:not(.stagepill)');
    p.className = `pill ${qualityKey(l.quality)}`;
    p.innerHTML = `<span class="d"></span>${l.quality}`;
  });
  document.getElementById('addNoteBtn').onclick = () => {
    const input = document.getElementById('newNote');
    const text = input.value.trim();
    if(!text) return;
    addNoteToLead(l, text);
    input.value = '';
    openLeadDetail(l.id); // re-render with new note
  };
  document.getElementById('newNote').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('addNoteBtn').click(); });
}

function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

/* ===================== boot ===================== */
updateNotifBtn();
checkMeetingAlerts();
renderDashboard();

// seed a friendly empty-state hint the very first time
if(!leads.length && !localStorage.getItem('skypath_seen_v1')){
  localStorage.setItem('skypath_seen_v1','1');
}
</script>
</body>
</html>
